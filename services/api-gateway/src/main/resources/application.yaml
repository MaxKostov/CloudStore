server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth_service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**